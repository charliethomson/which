# This repo's CI as kiln pipelines. `cargo run --manifest-path .kiln/Cargo.toml -- emit woodpecker`
# writes `.woodpecker/`, which Woodpecker runs unchanged (https://standards.thmsn.dev/d/ci-cd).
#
# A standalone workspace, like every `.kiln/`: its own lockfile, target dir and feature
# unification, so editing a pipeline never touches the product build. kiln and libci are
# private, so both come over ssh and the generated workflows fetch them with the repo's
# checkout key (`src/main.rs`).
[workspace]
resolver = "3"

[package]
name = "which-kiln"
version = "0.0.0"
edition = "2024"
publish = false

[dependencies]
# `windows` for the Git Bash the registry client needs on the Windows agent.
kiln = { git = "ssh://git@github.com/charliethomson/kiln.git", features = ["rust", "git", "windows"] }
# `templates` for rust.ci, `registry` for the release.
libci = { git = "ssh://git@github.com/charliethomson/libci.git", features = ["templates", "registry"] }
